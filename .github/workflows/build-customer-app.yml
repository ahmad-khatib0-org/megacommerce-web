name: Build and Push customer-app

on:
  push:
    tags:
      - "dev-customer-app-*"
      - "v*"
    paths:
      - "apps/customer-app/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"

env:
  REGISTRY: docker.io
  SERVICE_NAME: megacommerce-customer-app
  APP_NAME: customer-app
  PORT: 3001

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#dev-customer-app-}
          VERSION=${VERSION#dev-}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push customer-app
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/customer-app/Dockerfile.dev
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.SERVICE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.SERVICE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min,compression=gzip
