# Legacy workflow - kept for backwards compatibility
# Use individual workflows instead: build-home-app.yml, build-customer-app.yml, etc.
# Trigger: git tag -a dev-home-app-v1.0.0 -m "Release"
#          git push origin dev-home-app-v1.0.0

name: Build and Push Web Apps (Legacy - Use Individual Workflows)

on:
  push:
    tags:
      - "dev-*"
      - "v*"

env:
  REGISTRY: docker.io

jobs:
  build-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [home-app, customer-app, supplier-app, shared-api]
        include:
          - app: home-app
            service_name: megacommerce-home-app
            port: 3000
          - app: customer-app
            service_name: megacommerce-customer-app
            port: 3001
          - app: supplier-app
            service_name: megacommerce-supplier-app
            port: 3002
          - app: shared-api
            service_name: megacommerce-shared-api
            port: 3003

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#dev-}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile.dev
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ matrix.service_name }}:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ matrix.service_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min,compression=gzip
